<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — NolimitCoder</title>
<link rel="icon" type="image/png" href="./assets/logo.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-noise"></div>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">
      <img src="./assets/logo.png" alt="Nolimit" class="brand-logo">
      <span class="brand-text">NolimitCoder</span>
      <span class="brand-pill">PAID&nbsp;UNLIMITED</span>
    </div>
  </div>
</header>

<main class="pay">
  <div class="pay-card">
    <h1 id="payTitle">Checkout</h1>
    <p class="pay-sub">NolimitCoder by NolimitCode</p>
    <div class="pay-row"><b id="planName">Unlimited</b><span id="planPrice">$14.02</span></div>
    <div class="pay-row total"><b>Total</b><span id="planTotal">$14.02</span></div>
    <span class="pay-soon">OUR OWN PAYMENT — COMING SOON</span>
    <a class="pay-back" href="./index.html#pricing">← Back to pricing</a>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <div class="brand">
      <img src="./assets/logo.png" alt="Nolimit" class="brand-logo sm">
      <span class="brand-text">NolimitCoder</span>
    </div>
    <div class="foot-links">
      <a href="./podminky.html">Terms of Use</a>
      <a href="./soukromi.html">Privacy Policy</a>
      <a href="./index.html">← Back to web</a>
    </div>
    <span class="foot-muted">Modely od NolimitCode • 2026</span>
  </div>
</footer>

<script>
(function () {
  var plan = new URLSearchParams(location.search).get('plan');
  if (plan === 'free') {
    document.getElementById('payTitle').textContent = 'Start your FREE trial';
    document.getElementById('planName').textContent = 'FREE — 1-day trial';
    document.getElementById('planPrice').textContent = '$0';
    document.getElementById('planTotal').textContent = '$0';
  }
})();
</script>
</body>
</html>
